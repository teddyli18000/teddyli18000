<svg xmlns="http://www.w3.org/2000/svg" width="470" height="240" viewBox="0 0 470 240" role="img" aria-label="Public GitHub activity">
  <rect x="1" y="1" width="468" height="238" rx="14" fill="#263746" stroke="#435666"/>
  <text x="28" y="40" class="title">Public activity</text>
  <text x="29" y="59" class="meta">AUTO-REFRESHED · PUBLIC GITHUB</text>
  <text x="28" y="94" class="label">Contributions</text><text x="292" y="94" text-anchor="end" class="value">398</text>
  <text x="28" y="126" class="label">Commits</text><text x="292" y="126" text-anchor="end" class="value">—</text>
  <text x="28" y="158" class="label">Public repos</text><text x="292" y="158" text-anchor="end" class="value">12</text>
  <text x="28" y="190" class="label">Upstream PRs</text><text x="292" y="190" text-anchor="end" class="value">17</text>
  <g transform="translate(382 132)">
    <circle r="49" fill="none" stroke="#3d5666" stroke-width="9"/>
    <circle r="49" fill="none" stroke="#69d2a5" stroke-width="9" stroke-linecap="round" stroke-dasharray="54 254" transform="rotate(-90)"/>
    <text x="0" y="2" text-anchor="middle" class="ringValue">3</text>
    <text x="0" y="22" text-anchor="middle" class="ringLabel">MERGED</text>
  </g>
