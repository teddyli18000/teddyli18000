name: Refresh profile

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:
    inputs:
      render_assets:
        description: "Regenerate committed motion assets"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install raster dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_assets }}
        run: pip install -r requirements-assets.txt

      - name: Render committed motion assets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_assets }}
        run: python scripts/render_assets.py

      - name: Generate curated live section
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: teddyli18000
        run: python scripts/generate_profile.py

      - name: Verify generated profile
        run: python scripts/check_profile.py

      - name: Commit meaningful changes only
        run: |
          if git diff --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/hero-*.gif assets/hero-*.png assets/millikan-mark-*.gif assets/millikan-mark-*.png assets/sidequest-*.gif assets/sidequest-*.png assets/live-light.svg assets/live-dark.svg data/live.json
          git commit -m "chore(profile): refresh living profile"
          git push
