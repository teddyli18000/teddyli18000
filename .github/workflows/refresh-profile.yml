name: Refresh profile

on:
  schedule:
    # Check every two hours at minute 17 (GitHub cron is UTC).
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches:
      - agent/profile-v7-compact-dashboard
    paths:
      - scripts/generate_profile.py
  pull_request:
    paths:
      - README.md
      - data/**
      - assets/activity-card.svg
      - assets/languages-card.svg
      - scripts/generate_profile.py
      - scripts/check_profile.py
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: teddyli18000
        run: python scripts/generate_profile.py
      - name: Verify generated profile
        run: python scripts/check_profile.py
      - name: Commit profile refresh
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if git diff --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/live.json assets/activity-card.svg assets/languages-card.svg
          git commit -m "chore(profile): refresh public activity"
          git push
