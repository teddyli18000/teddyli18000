name: Refresh profile

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate curated live section
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: teddyli18000
        run: python scripts/generate_profile.py

      - name: Verify generated profile
        run: python scripts/check_profile.py

      - name: Commit meaningful changes only
        run: |
          if git diff --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/live-light.svg assets/live-dark.svg data/live.json
          git commit -m "chore(profile): refresh live signal"
          git push
