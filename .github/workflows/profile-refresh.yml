name: Profile refresh

on:
  # GitHub scheduled workflows are best-effort and may occasionally drop a
  # delivery. Use several off-peak windows per hour; the generator itself only
  # advances the visible timestamp once per SGT hour, so successful fallbacks
  # do not create duplicate hourly refresh commits.
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-refresh.yml
      - scripts/generate_profile.py
      - scripts/polish_cards.py
      - scripts/check_profile.py
  pull_request:
    paths:
      - README.md
      - data/**
      - assets/**
      - scripts/generate_profile.py
      - scripts/polish_cards.py
      - scripts/check_profile.py
      - .github/workflows/profile-refresh.yml
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: profile-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&rank_icon=percentile&hide=stars,issues&show=prs_merged&custom_title=GitHub%20activity&card_width=470&line_height=29&border_radius=14&bg_color=263746&title_color=69D2A5&text_color=F3F6F8&icon_color=69D2A5&border_color=435666&number_format=long"
          path: assets/stats-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&langs_count=8&card_width=470&bg_color=263746&title_color=69D2A5&text_color=F3F6F8&border_color=435666&border_radius=14"
          path: assets/languages-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate full-history contribution source
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false
          THEME: github_dark

      - name: Apply profile card polish
        run: python scripts/polish_cards.py

      - name: Refresh upstream activity and visible timestamp
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: teddyli18000
        run: python scripts/generate_profile.py

      - name: Verify generated profile
        run: python scripts/check_profile.py

      - name: Commit profile refresh
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if git diff --quiet; then
            echo "Profile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/live.json assets/stats-card.svg assets/languages-card.svg
          git commit -m "chore(profile): refresh public activity"
          git push
