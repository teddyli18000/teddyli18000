name: Render profile preview

on:
  push:
    branches:
      - agent/profile-v3-human-motion
    paths:
      - README.md
      - scripts/render_assets.py
      - scripts/check_profile.py
      - assets/live-*.svg
      - AGENTS.md
      - docs/design-system.md
      - .github/workflows/render-profile-preview.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install raster dependencies
        run: pip install -r requirements-assets.txt

      - name: Render motion assets
        run: python scripts/render_assets.py

      - name: Validate profile
        run: python scripts/check_profile.py

      - name: Commit rendered assets
        run: |
          if git diff --quiet -- assets; then
            echo "Rendered assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-*.gif assets/hero-*.png assets/millikan-mark-*.gif assets/millikan-mark-*.png assets/sidequest-*.gif assets/sidequest-*.png
          git commit -m "chore(profile): render authored motion assets"
          git push
